<div class="card-ui mb-4">

    <div class="p-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h4 class="mb-1">

                    <i class="bi bi-box-arrow-in-down text-primary"></i>

                    ورود کالا

                </h4>

                <small class="text-muted">

                    ثبت ورود کالا به انبار

                </small>

            </div>

            <button
                class="btn btn-primary"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#stockInForm">

                <i class="bi bi-box-arrow-in-down"></i>

                ورود کالا

            </button>

        </div>

        <div class="collapse mt-4" id="stockInForm">

            <form method="POST" action="/move">

                <input type="hidden" name="type" value="IN">

                <div class="row g-3">

                    <div class="col-md-5">

                        <label class="form-label">کالا</label>

                        <select
                            class="form-select"
                            name="product_id"
                            required>

                            {% for product in products %}

                            <option value="{{ product.id }}">

                                {{ product.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">تعداد</label>

                        <input
                            type="number"
                            class="form-control"
                            name="qty"
                            min="1"
                            required>

                    </div>

                    <div class="col-md-5">

                        <label class="form-label">توضیحات</label>

                        <input
                            type="text"
                            class="form-control"
                            name="description">

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        ثبت ورود کالا

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
