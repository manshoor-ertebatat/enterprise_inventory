<div class="collapse mb-4" id="panelStockOut">

<div class="card-ui mb-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h4 class="mb-1">
                    <i class="bi bi-box-arrow-up text-danger"></i>
                    خروج کالا
                </h4>

                <small class="text-muted">
                    ثبت خروج کالا از انبار
                </small>

            </div>

        </div>

        <div class="mt-4">

            <form method="POST" action="/move">

                <input type="hidden" name="type" value="OUT">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">کالا</label>

                        <select
                            class="form-select"
                            name="product_id"
                            required>

                            {% for product in products %}
                            <option value="{{ product.id }}">
                                {{ product.name }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">تعداد</label>

                        <input
                            type="number"
                            class="form-control"
                            name="qty"
                            min="1"
                            required>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">تحویل گیرنده</label>

                        <input
                            type="text"
                            class="form-control"
                            name="receiver_name">

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">نوع خروج</label>

                        <select
                            class="form-select"
                            id="outType">

                            <option value="project">پروژه</option>
                            <option value="sale">فروش</option>
                            <option value="loan">امانت</option>
                            <option value="transfer">انتقال</option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            نام مشتری
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="customer_name"
                            placeholder="مثلاً شرکت پارس">

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            نام پروژه
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="project_name"
                            placeholder="مثلاً پروژه شهرداری منطقه ۹">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            توضیحات
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="description">

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-danger">

                        ثبت خروج کالا

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
