<!DOCTYPE html>
<html dir="rtl">

<head>

<meta charset="UTF-8">

<title>ویرایش کالا</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card">

<div class="card-header">
ویرایش کالا
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>نام کالا</label>

<input
class="form-control"
name="name"
value="{{ product.name }}"
>

</div>

<div class="mb-3">

<label>موجودی</label>

<input
class="form-control"
name="qty"
value="{{ product.qty }}"
>

</div>

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox"
name="has_serial"
value="1"
id="has_serial"
{% if product.has_serial %}checked{% endif %}>

<label
class="form-check-label"
for="has_serial">

این کالا شماره سریال دارد

</label>

</div>

<div class="mb-3">
<label>وضعیت فیزیکی کالا</label>
<select class="form-select" name="condition">
<option value="نو" {% if product.condition == "نو" or not product.condition %}selected{% endif %}>نو</option>
<option value="دست‌دوم" {% if product.condition == "دست‌دوم" %}selected{% endif %}>دست‌دوم</option>
<option value="مستهلک" {% if product.condition == "مستهلک" %}selected{% endif %}>مستهلک</option>
<option value="نیازمند تعمیر" {% if product.condition == "نیازمند تعمیر" %}selected{% endif %}>نیازمند تعمیر</option>
<option value="رزرو شده" {% if product.condition == "رزرو شده" %}selected{% endif %}>رزرو شده</option>
</select>
</div>

<div class="mb-3">
<label>دسته‌بندی کالا</label>
<select class="form-select" name="category">
<option value="دوربین مداربسته" {% if product.category == "دوربین مداربسته" %}selected{% endif %}>دوربین مداربسته</option>
<option value="دستگاه ضبط NVR / DVR" {% if product.category == "دستگاه ضبط NVR / DVR" %}selected{% endif %}>دستگاه ضبط NVR / DVR</option>
<option value="هارد دیسک" {% if product.category == "هارد دیسک" %}selected{% endif %}>هارد دیسک</option>
<option value="تجهیزات شبکه" {% if product.category == "تجهیزات شبکه" %}selected{% endif %}>تجهیزات شبکه</option>
<option value="تجهیزات مخابراتی" {% if product.category == "تجهیزات مخابراتی" %}selected{% endif %}>تجهیزات مخابراتی</option>
<option value="نمایشگر" {% if product.category == "نمایشگر" %}selected{% endif %}>نمایشگر</option>
<option value="قطعات کامپیوتر" {% if product.category == "قطعات کامپیوتر" %}selected{% endif %}>قطعات کامپیوتر</option>
<option value="کابل و متعلقات" {% if product.category == "کابل و متعلقات" %}selected{% endif %}>کابل و متعلقات</option>
<option value="لوازم نصب" {% if product.category == "لوازم نصب" %}selected{% endif %}>لوازم نصب</option>
<option value="منبع تغذیه و برق" {% if product.category == "منبع تغذیه و برق" %}selected{% endif %}>منبع تغذیه و برق</option>
<option value="سایر" {% if product.category == "سایر" or not product.category %}selected{% endif %}>سایر</option>
</select>
</div>

<div class="mb-3">
<label>واحد اندازه‌گیری</label>
<select class="form-select" name="unit">
<option value="عدد" {% if product.unit == "عدد" %}selected{% endif %}>عدد</option>
<option value="دستگاه" {% if product.unit == "دستگاه" %}selected{% endif %}>دستگاه</option>
<option value="متر" {% if product.unit == "متر" %}selected{% endif %}>متر</option>
<option value="شاخه" {% if product.unit == "شاخه" %}selected{% endif %}>شاخه</option>
<option value="حلقه" {% if product.unit == "حلقه" %}selected{% endif %}>حلقه</option>
<option value="کارتن" {% if product.unit == "کارتن" %}selected{% endif %}>کارتن</option>
<option value="بسته" {% if product.unit == "بسته" %}selected{% endif %}>بسته</option>
<option value="رول" {% if product.unit == "رول" %}selected{% endif %}>رول</option>
<option value="کیلوگرم" {% if product.unit == "کیلوگرم" %}selected{% endif %}>کیلوگرم</option>
</select>
</div>

<div class="mb-3">
<label>حداقل موجودی برای هشدار</label>

<input
class="form-control"
type="text"
inputmode="numeric"
name="min_qty"
value="{{ product.min_qty }}">
</div>

<button class="btn btn-success">
ذخیره تغییرات
</button>

<a href="/dashboard" class="btn btn-secondary">
بازگشت
</a>

</form>

</div>

</div>

</div>

</body>

</html>
