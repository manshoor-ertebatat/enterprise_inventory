<!DOCTYPE html>
<html dir="rtl" lang="fa">

<head>

<meta charset="UTF-8">

<title>ویرایش کاربر</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h3>ویرایش کاربر</h3>

<hr>

<form method="POST" action="/users/update/{{ user.id }}">

<div class="mb-3">

<label class="form-label">
نام کاربری
</label>

<input
class="form-control"
name="username"
value="{{ user.username }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
رمز عبور جدید
</label>

<input
type="password"
class="form-control"
name="password"
placeholder="اگر خالی بماند، تغییر نمی‌کند">

</div>

<div class="mb-3">

<label class="form-label">
نقش
</label>

<select
class="form-select"
name="role">

<option
value="admin"
{% if user.role=="admin" %}selected{% endif %}>
مدیر
</option>

<option
value="warehouse"
{% if user.role=="warehouse" %}selected{% endif %}>
انباردار
</option>

<option
value="viewer"
{% if user.role=="viewer" %}selected{% endif %}>
مشاهده کننده
</option>

</select>

</div>

<button class="btn btn-success">

ذخیره تغییرات

</button>

<a
href="/users"
class="btn btn-secondary">

انصراف

</a>

</form>

</div>

</body>

</html>
