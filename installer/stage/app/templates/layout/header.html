<header class="topbar">

    <div class="topbar-left">

        <button class="menu-btn" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
        </button>

        <div class="company-title">
            <h5 class="mb-0">منشور ارتباطات</h5>
            <small>سیستم انبارداری</small>
        </div>

    </div>

    <div class="topbar-center">

        <a href="/dashboard">

            <img
                src="/static/logo.png"
                class="header-logo"
                alt="Manshoor">

        </a>

    </div>

    <div class="topbar-right">

        <span class="user-name">

            <i class="bi bi-person-circle"></i>

            {{ session.get("user","کاربر") }}

        </span>

        {% if session.get("role") %}

        <span class="badge bg-primary">

            {{ session.get("role") }}

        </span>

        {% endif %}

        <a href="/logout" class="btn btn-danger btn-sm">

            <i class="bi bi-box-arrow-right"></i>

            خروج

        </a>

    </div>

</header>
